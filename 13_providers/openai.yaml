# Provider: openai
#
# OpenAI's hosted models. Speaks the OpenAI Chat Completions API (the same
# wire format adopted by many other providers as a compatibility surface), is
# wrapped by the official OpenAI SDKs, and is reachable through the Codex CLI
# for code-class work.

name: openai
location: cloud

documentation:
  summary: |
    OpenAI's hosted model catalog (GPT-class chat, code, embedding, and vision).
    The canonical owner of the OpenAI Chat Completions wire format.
  homepage: https://platform.openai.com
  vendor: OpenAI

endpoint: https://api.openai.com
auth: api_key
env:
  api_key: OPENAI_API_KEY

protocols:
  cli:
    binary: codex
  sdk:
    package: openai
    languages: [python, typescript]
  openai-api:
    base_url: https://api.openai.com/v1
