- id: provider.claude.provider
  title: claude
  description: >
    Anthropic's hosted Claude models. Accessed via the Anthropic Messages API
    (no OpenAI-compatible endpoint), the official Anthropic SDKs, or the Claude
    Code CLI.
  tags: [provider]
  extends: provider.base
  variables:
    name: claude
    location: cloud
    documentation:
      summary: |
        Anthropic's hosted Claude models. Accessed via the Anthropic Messages API
        (no OpenAI-compatible endpoint), the official Anthropic SDKs, or the Claude
        Code CLI.
      homepage: https://www.anthropic.com
      vendor: Anthropic
    endpoint: https://api.anthropic.com
    auth: api_key
    env:
      api_key: ANTHROPIC_API_KEY
    protocols:
      cli:
        binary: claude
      sdk:
        package: anthropic
        languages: [python, typescript]
      anthropic-api:
        base_url: https://api.anthropic.com
