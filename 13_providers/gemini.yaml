# Provider: gemini
#
# Google's hosted Gemini model family. Speaks the Google GenAI API (not
# OpenAI-compatible), is wrapped by the google-genai SDK, and is reachable
# through the Gemini CLI.

name: gemini
location: cloud

documentation:
  summary: |
    Google's hosted Gemini models. Accessed via the Google GenAI API, the
    google-genai SDK, or the Gemini CLI.
  homepage: https://ai.google.dev
  vendor: Google

endpoint: https://generativelanguage.googleapis.com
auth: api_key
env:
  api_key: GEMINI_API_KEY

protocols:
  cli:
    binary: gemini
  sdk:
    package: google-genai
    languages: [python, typescript]
  google-api:
    base_url: https://generativelanguage.googleapis.com
