---
# Run `pre-commit install` once after `uv sync --extra dev` to activate.
# Then every `git commit` runs these hooks against staged files.

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (python)
        entry: .venv/bin/ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check (python)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: yamlfix
        name: yamlfix (yaml)
        entry: .venv/bin/yamlfix
        language: system
        types: [yaml]
        exclude: ^(\.venv|14_data|18_docs|node_modules)/

      - id: yaml-block-scalars
        name: yaml block-scalar promotion
        entry: .venv/bin/python scripts/yaml_block_scalars.py
        language: system
        types: [yaml]
        exclude: ^(\.venv|14_data|18_docs|node_modules)/

      - id: yamllint
        name: yamllint (yaml)
        entry: .venv/bin/yamllint
        language: system
        types: [yaml]
        exclude: ^(\.venv|14_data|18_docs|node_modules)/

      - id: mdformat
        name: mdformat (markdown)
        entry: .venv/bin/mdformat
        language: system
        types: [markdown]
        exclude: ^(\.venv|18_docs|node_modules)/
