# Required env: DATA_PATH
# Optional env: QDRANT_HTTP_PORT (default 6333), QDRANT_GRPC_PORT (default 6334)
services:
  qdrant:
    image: qdrant/qdrant
    container_name: contentgraph-qdrant
    restart: unless-stopped
    ports:
    - ${QDRANT_HTTP_PORT:-6333}:6333
    - ${QDRANT_GRPC_PORT:-6334}:6334
    volumes:
    - ${DATA_PATH}:/qdrant/storage
