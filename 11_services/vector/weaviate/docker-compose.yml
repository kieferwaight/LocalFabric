# Required env: DATA_PATH
# Optional env: WEAVIATE_HTTP_PORT (default 8085), WEAVIATE_GRPC_PORT (default 50051)
services:
  weaviate:
    image: semitechnologies/weaviate
    container_name: contentgraph-weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: '25'
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    ports:
    - ${WEAVIATE_HTTP_PORT:-8085}:8080
    - ${WEAVIATE_GRPC_PORT:-50051}:50051
    volumes:
    - ${DATA_PATH}:/var/lib/weaviate
