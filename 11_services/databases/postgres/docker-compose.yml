# Required env: DATA_PATH, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
# Optional env: POSTGRES_PORT (default 5433)
services:
  postgres:
    image: postgres:16
    container_name: contentgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-contentgraph}
    ports:
    - ${POSTGRES_PORT:-5433}:5432
    volumes:
    - ${DATA_PATH}:/var/lib/postgresql/data
