# Required env: DATABASE_URL, NEO4J_PASSWORD
# Optional env: FASTAPI_PORT (default 8000), NEO4J_URI, NEO4J_USER, REDIS_URL, MINIO_ENDPOINT, TIKA_URL
services:
  contentgraph-api:
    build: .
    image: contentgraph-api:local
    container_name: contentgraph-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      TIKA_URL: ${TIKA_URL:-http://tika:9998}
    ports:
    - ${FASTAPI_PORT:-8000}:8000
