name: yaml-docs-check
on:
  pull_request:
    paths:
    - 03_schemas/**
    - 02_core/**
    - 05_tasks/**
    - 06_workflows/**
    - 09_docker/**
    - 10_launchd/**
    - 12_prompts/**
    - 13_models/**
    - 15_examples/**
    - 17_providers/**
    - 18_docs/**
    - 19_templates/**
    - .github/workflows/yaml-docs-check.yml
  push:
    branches:
    - main
    paths:
    - 03_schemas/**
    - 02_core/**
    - 05_tasks/**
    - 06_workflows/**
    - 09_docker/**
    - 10_launchd/**
    - 12_prompts/**
    - 13_models/**
    - 15_examples/**
    - 17_providers/**
    - 18_docs/**
    - 19_templates/**
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: uv sync --locked --extra dev
    - name: Verify 18_docs/ is up to date
      run: uv run python -m core.runtimes.yaml.regenerate_docs --mode=check
