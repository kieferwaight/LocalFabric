name: yaml-docs-check

on:
  pull_request:
    paths:
      - "20_workspaces/06_workflows/yaml/**"
      - ".github/workflows/yaml-docs-check.yml"
  push:
    branches: [main]
    paths:
      - "20_workspaces/06_workflows/yaml/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 20_workspaces
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Verify generated YAML docs are current
        working-directory: 20_workspaces/06_workflows/yaml
        run: |
          python interpreter.py config.yaml docs/api/reference \
            --output_dir=docs --mode=check
