name: test
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: uv sync --locked --extra dev
    - name: pytest
      run: uv run pytest
