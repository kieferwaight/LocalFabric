---
name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: ruff format check
        run: ruff format --check .
      - name: ruff lint
        run: ruff check .
      - name: yamlfix check
        run: |
          find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
              -not -path './.venv/*' -not -path './14_data/*' \
              -not -path './18_docs/*' -not -path './node_modules/*' \
              -print0 | xargs -0 yamlfix --check
      - name: yaml block-scalar check
        run: python scripts/yaml_block_scalars.py --check
      - name: yamllint
        run: yamllint .
      - name: mdformat check
        run: |
          find . -type f -name '*.md' \
              -not -path './.venv/*' -not -path './18_docs/*' \
              -not -path './node_modules/*' \
              -print0 | xargs -0 mdformat --check
