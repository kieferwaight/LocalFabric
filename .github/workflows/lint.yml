name: lint
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: uv sync --locked --extra dev
    - name: ruff format check
      run: uv run ruff format --check .
    - name: ruff lint
      run: uv run ruff check .
    - name: yamlfix check
      run: |
        find . -type f \( -name '*.yaml' -o -name '*.yml' \) \
            -not -path './.venv/*' -not -path './14_data/*' \
            -not -path './18_docs/*' -not -path './node_modules/*' \
            -not -path './.claude/*' \
            -print0 | xargs -0 uv run yamlfix --check
    - name: yaml block-scalar check
      run: uv run python scripts/yaml_block_scalars.py --check
    - name: yamllint
      run: uv run yamllint .
    - name: mdformat check
      run: |-
        find . -type f -name '*.md' \
            -not -path './.venv/*' -not -path './18_docs/*' \
            -not -path './node_modules/*' -not -path './.claude/*' \
            -print0 | xargs -0 uv run mdformat --check
    - name: docs-check
      run: uv run python -m core.runtimes.yaml.regenerate_docs --mode=check
