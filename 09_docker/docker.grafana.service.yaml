- id: docker.grafana.service
  title: Grafana Service
  description: |
    Grafana dashboard server fronting Prometheus, Jaeger, and other data sources used
    for observability of the content graph stack. Persistent state lives on DATA_PATH.
  tags: [docker, observability]
  extends: docker.base
  inputs:
    DATA_PATH:
      type: "string"
      required: true
      description: Host path for Grafana state (binds to /var/lib/grafana in container)
    GF_SECURITY_ADMIN_USER:
      type: "string"
      required: true
      description: Grafana admin user
    GF_SECURITY_ADMIN_PASSWORD:
      type: "string"
      required: true
      description: Grafana admin password
    GRAFANA_PORT:
      type: "string"
      required: false
      default: "3002"
      description: Host port to expose the Grafana HTTP interface (default 3002)
  variables:
    services:
      grafana:
        image: grafana/grafana
        container_name: contentgraph-grafana
        restart: unless-stopped
        environment:
          GF_SECURITY_ADMIN_USER: "{{ GF_SECURITY_ADMIN_USER }}"
          GF_SECURITY_ADMIN_PASSWORD: "{{ GF_SECURITY_ADMIN_PASSWORD }}"
        ports:
          - "{{ GRAFANA_PORT }}:3000"
        volumes:
          - "{{ DATA_PATH }}:/var/lib/grafana"
