- id: docker.clamav
  title: ClamAV Service
  description: |
    ClamAV antivirus daemon used to scan ingested documents and uploaded artifacts. The
    bound data volume holds virus signature databases between restarts.
  tags: [docker, document]
  extends: docker.base
  inputs:
    DATA_PATH:
      type: "string"
      required: true
      description: Host path for ClamAV signature databases (binds to /var/lib/clamav in container)
    CLAMAV_PORT:
      type: "string"
      required: false
      default: "3310"
      description: Host port to bind clamd (default 3310)
  variables:
    services:
      clamav:
        image: clamav/clamav
        container_name: contentgraph-clamav
        restart: unless-stopped
        ports:
          - "{{ CLAMAV_PORT }}:3310"
        volumes:
          - "{{ DATA_PATH }}:/var/lib/clamav"
