id: docker.casbin-service
name: casbin-service
category: auth
purpose: |
  Local Casbin authorization service built from the bundled FastAPI app. Provides a
  minimal HTTP surface for policy enforcement decisions in the content graph stack.

inputs:
  CASBIN_PORT:
    default: 8090
    description: Host port to expose the Casbin service HTTP API (default 8090)
    required: false

services:
  casbin-service:
    build: .
    image: contentgraph-casbin-service:local
    container_name: contentgraph-casbin-service
    restart: unless-stopped
    ports:
      - map: "{{ CASBIN_PORT }}:8080"
        description: Casbin authorization service HTTP API

files:
  - path: ./Dockerfile
    content: |
      FROM python:3.12-slim

      WORKDIR /app
      RUN pip install --no-cache-dir fastapi uvicorn[standard] casbin
      COPY app /app

      EXPOSE 8080
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080"]
  - path: ./app/main.py
    content: |
      from fastapi import FastAPI

      app = FastAPI(title="Casbin Authorization Service")


      @app.get("/health")
      def health() -> dict[str, str]:
          return {"status": "ok"}
