- id: docker.minio.service
  title: MinIO Service
  description: |
    MinIO S3-compatible object storage server with the console enabled. Used as the
    blob store for ingested artifacts and intermediate pipeline outputs.
  tags:
  - docker
  - storage
  extends: docker.base
  inputs:
    DATA_PATH:
      type: string
      required: true
      description: Host path for MinIO object storage (binds to /data in container)
    MINIO_ROOT_USER:
      type: string
      required: true
      description: MinIO root username
    MINIO_ROOT_PASSWORD:
      type: string
      required: true
      description: MinIO root password
    MINIO_API_PORT:
      type: string
      required: false
      default: '9000'
      description: Host port for the MinIO S3 API (default 9000)
    MINIO_CONSOLE_PORT:
      type: string
      required: false
      default: '9001'
      description: Host port for the MinIO console (default 9001)
  variables:
    services:
      minio:
        image: minio/minio
        container_name: contentgraph-minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
          MINIO_ROOT_USER: '{{ MINIO_ROOT_USER }}'
          MINIO_ROOT_PASSWORD: '{{ MINIO_ROOT_PASSWORD }}'
        ports:
        - '{{ MINIO_API_PORT }}:9000'
        - '{{ MINIO_CONSOLE_PORT }}:9001'
        volumes:
        - '{{ DATA_PATH }}:/data'
