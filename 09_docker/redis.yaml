id: docker.redis
name: redis
category: databases
purpose: |
  Redis 7 instance configured with append-only persistence. Used for caching, queues,
  and rate limiting across the content graph services.

inputs:
  DATA_PATH:
    description: Host path for Redis append-only data (binds to /data in container)
    required: true
  REDIS_PORT:
    default: 6379
    description: Host port to bind the Redis protocol (default 6379)
    required: false

services:
  redis:
    image: redis:7
    container_name: contentgraph-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - map: "{{ REDIS_PORT }}:6379"
        description: Redis client protocol
    volumes:
      - map: {{ DATA_PATH }}:/data
        description: Redis append-only file directory
