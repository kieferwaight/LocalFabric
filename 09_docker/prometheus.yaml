id: docker.prometheus
name: prometheus
category: observability
purpose: |
  Prometheus metrics server scraping local fabric services. Loads its scrape config
  from ./config/prometheus.yml and persists TSDB data on DATA_PATH.

inputs:
  DATA_PATH:
    description: Host path for the Prometheus TSDB (binds to /prometheus in container)
    required: true
  PROMETHEUS_PORT:
    default: 9090
    description: Host port to expose the Prometheus HTTP interface (default 9090)
    required: false

services:
  prometheus:
    image: prom/prometheus
    container_name: contentgraph-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - map: "{{ PROMETHEUS_PORT }}:9090"
        description: Prometheus HTTP interface
    volumes:
      - map: ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        description: Prometheus scrape configuration
      - map: {{ DATA_PATH }}:/prometheus
        description: Prometheus TSDB storage

files:
  - path: ./config/prometheus.yml
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: jaeger
          static_configs:
            - targets: ["jaeger:14269"]
