- id: docker.libreoffice.service
  title: LibreOffice Conversion Service
  description: |
    Headless LibreOffice container used as a conversion worker for Office documents
    in the ingestion pipeline. Built locally; idles waiting for work on /work.
  tags:
  - docker
  - document
  extends: docker.base
  inputs:
    DATA_PATH:
      type: string
      required: true
      description: Host path for conversion work (binds to /work in container)
  variables:
    image_tag: contentgraph-libreoffice:local
    dockerfile_body: |
      FROM python:3.12-slim
      RUN apt-get update \
        && apt-get install -y --no-install-recommends libreoffice \
        && rm -rf /var/lib/apt/lists/*
      WORKDIR /app
      COPY app /app
      CMD ["python", "worker.py"]
    services:
      libreoffice:
        build: .
        image: contentgraph-libreoffice:local
        container_name: contentgraph-libreoffice
        restart: unless-stopped
        volumes:
        - '{{ DATA_PATH }}:/work'
    extra_files:
    - path: app/worker.py
      content: |-
        import time
        print("libreoffice conversion worker ready")
        while True:
            time.sleep(60)
