id: docker.fastapi
name: fastapi
category: workers
purpose: |
  Content graph FastAPI service built locally. Provides the HTTP control plane and
  integrates with Postgres, Neo4j, Redis, MinIO, and Tika via environment URLs.

inputs:
  DATABASE_URL:
    description: PostgreSQL connection URL for the API
    required: true
  NEO4J_PASSWORD:
    description: Password for the Neo4j user
    required: true
  FASTAPI_PORT:
    default: 8000
    description: Host port to expose the FastAPI service (default 8000)
    required: false
  NEO4J_URI:
    default: bolt://neo4j:7687
    description: Bolt URI for the Neo4j server
    required: false
  NEO4J_USER:
    default: neo4j
    description: Neo4j username
    required: false
  REDIS_URL:
    default: redis://redis:6379/0
    description: Redis connection URL
    required: false
  MINIO_ENDPOINT:
    default: minio:9000
    description: MinIO endpoint host:port
    required: false
  TIKA_URL:
    default: http://tika:9998
    description: Apache Tika base URL
    required: false

services:
  contentgraph-api:
    build: .
    image: contentgraph-api:local
    container_name: contentgraph-api
    restart: unless-stopped
    environment:
      - map: DATABASE_URL: {{ DATABASE_URL }}
        description: PostgreSQL connection URL
      - map: NEO4J_URI: {{ NEO4J_URI }}
        description: Bolt URI for the Neo4j server
      - map: NEO4J_USER: {{ NEO4J_USER }}
        description: Neo4j username
      - map: NEO4J_PASSWORD: {{ NEO4J_PASSWORD }}
        description: Neo4j password
      - map: REDIS_URL: {{ REDIS_URL }}
        description: Redis connection URL
      - map: MINIO_ENDPOINT: {{ MINIO_ENDPOINT }}
        description: MinIO endpoint host:port
      - map: TIKA_URL: {{ TIKA_URL }}
        description: Apache Tika base URL
    ports:
      - map: "{{ FASTAPI_PORT }}:8000"
        description: FastAPI HTTP interface

files:
  - path: ./Dockerfile
    content: |
      FROM python:3.12-slim

      WORKDIR /app
      RUN pip install --no-cache-dir fastapi uvicorn[standard] psycopg[binary] redis neo4j boto3 httpx
      COPY app /app

      EXPOSE 8000
      CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  - path: ./app/main.py
    content: |
      from fastapi import FastAPI

      app = FastAPI(title="Content Graph API")


      @app.get("/health")
      def health() -> dict[str, str]:
          return {"status": "ok"}
