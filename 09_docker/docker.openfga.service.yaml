- id: docker.openfga.service
  title: OpenFGA Service
  description: |
    OpenFGA fine-grained authorization server running with in-memory storage and the
    playground enabled. Used for relationship-based access checks in the content graph.
  tags:
  - docker
  - auth
  extends: docker.base
  inputs:
    OPENFGA_HTTP_PORT:
      type: string
      required: false
      default: '8083'
      description: Host port to expose the OpenFGA HTTP API (default 8083)
    OPENFGA_GRPC_PORT:
      type: string
      required: false
      default: '8081'
      description: Host port to expose the OpenFGA gRPC API (default 8081)
    OPENFGA_PLAYGROUND_PORT:
      type: string
      required: false
      default: '3003'
      description: Host port to expose the OpenFGA Playground UI (default 3003)
  variables:
    services:
      openfga:
        image: openfga/openfga
        container_name: contentgraph-openfga
        restart: unless-stopped
        command: run --playground-enabled --datastore-engine memory
        ports:
        - '{{ OPENFGA_HTTP_PORT }}:8080'
        - '{{ OPENFGA_GRPC_PORT }}:8081'
        - '{{ OPENFGA_PLAYGROUND_PORT }}:3000'
