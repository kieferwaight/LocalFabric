- id: docker.traefik
  title: Traefik Service
  description: |
    Traefik v3 reverse proxy with the Docker provider enabled. Routes HTTP/HTTPS to
    labelled containers and exposes the insecure dashboard for local development.
  tags: [docker, proxy]
  extends: docker.base
  inputs:
    TRAEFIK_HTTP_PORT:
      type: "string"
      required: false
      default: "80"
      description: Host port for the HTTP entrypoint (default 80)
    TRAEFIK_HTTPS_PORT:
      type: "string"
      required: false
      default: "443"
      description: Host port for the HTTPS entrypoint (default 443)
    TRAEFIK_DASHBOARD_PORT:
      type: "string"
      required: false
      default: "8080"
      description: Host port for the Traefik dashboard (default 8080)
  variables:
    services:
      traefik:
        image: traefik:v3
        container_name: contentgraph-traefik
        restart: unless-stopped
        command:
          - --api.dashboard=true
          - --api.insecure=true
          - --providers.docker=true
          - --providers.docker.exposedbydefault=false
          - --entrypoints.web.address=:80
          - --entrypoints.websecure.address=:443
        ports:
          - "{{ TRAEFIK_HTTP_PORT }}:80"
          - "{{ TRAEFIK_HTTPS_PORT }}:443"
          - "{{ TRAEFIK_DASHBOARD_PORT }}:8080"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
          - "./config:/etc/traefik:ro"
    extra_files:
      - path: "config/.gitkeep"
        content: ""
