id: docker.traefik
name: traefik
category: proxy
purpose: |
  Traefik v3 reverse proxy with the Docker provider enabled. Routes HTTP/HTTPS to
  labelled containers and exposes the insecure dashboard for local development.

inputs:
  TRAEFIK_HTTP_PORT:
    default: 80
    description: Host port for the HTTP entrypoint (default 80)
    required: false
  TRAEFIK_HTTPS_PORT:
    default: 443
    description: Host port for the HTTPS entrypoint (default 443)
    required: false
  TRAEFIK_DASHBOARD_PORT:
    default: 8080
    description: Host port for the Traefik dashboard (default 8080)
    required: false

services:
  traefik:
    image: traefik:v3
    container_name: contentgraph-traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - map: "{{ TRAEFIK_HTTP_PORT }}:80"
        description: HTTP entrypoint
      - map: "{{ TRAEFIK_HTTPS_PORT }}:443"
        description: HTTPS entrypoint
      - map: "{{ TRAEFIK_DASHBOARD_PORT }}:8080"
        description: Traefik dashboard
    volumes:
      - map: /var/run/docker.sock:/var/run/docker.sock:ro
        description: Docker socket for the Traefik Docker provider
      - map: ./config:/etc/traefik:ro
        description: Static and dynamic configuration directory

files:
  - path: ./config/.gitkeep
    content: ""
