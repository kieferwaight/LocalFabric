- id: docker.n8n.service
  title: n8n Service
  description: |
    n8n workflow automation server used for low-code orchestration of local fabric
    services. Bound data volume persists credentials, workflows, and execution history.
  tags:
  - docker
  - workers
  extends: docker.base
  inputs:
    DATA_PATH:
      type: string
      required: true
      description: Host folder for n8n state (binds to /home/node/.n8n in container)
    N8N_PORT:
      type: string
      required: false
      default: '5678'
      description: Host port to expose the n8n HTTP interface (default 5678)
    N8N_HOST:
      type: string
      required: false
      default: localhost
      description: Hostname n8n advertises in webhook URLs
    GENERIC_TIMEZONE:
      type: string
      required: false
      default: UTC
      description: Timezone for scheduled workflows
  variables:
    services:
      n8n:
        image: n8nio/n8n:latest
        container_name: localfabric-n8n
        restart: unless-stopped
        environment:
          N8N_HOST: '{{ N8N_HOST }}'
          N8N_PORT: '{{ N8N_PORT }}'
          N8N_PROTOCOL: http
          WEBHOOK_URL: http://{{ N8N_HOST }}:{{ N8N_PORT }}/
          GENERIC_TIMEZONE: '{{ GENERIC_TIMEZONE }}'
          N8N_DIAGNOSTICS_ENABLED: 'false'
          N8N_RUNNERS_ENABLED: 'true'
        ports:
        - '{{ N8N_PORT }}:5678'
        volumes:
        - '{{ DATA_PATH }}:/home/node/.n8n'
