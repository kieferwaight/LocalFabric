- id: docker.tika
  title: Apache Tika Service
  description: |
    Apache Tika full server for content extraction and metadata detection across a
    wide range of document formats. Stateless; no data volume required.
  tags: [docker, document]
  extends: docker.base
  inputs:
    TIKA_PORT:
      type: "string"
      required: false
      default: "9998"
      description: Host port to expose the Tika HTTP API (default 9998)
  variables:
    services:
      tika:
        image: apache/tika:latest-full
        container_name: contentgraph-tika
        restart: unless-stopped
        ports:
          - "{{ TIKA_PORT }}:9998"
