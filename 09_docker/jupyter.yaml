id: docker.jupyter
name: jupyter
category: dev
purpose: |
  Jupyter notebook server with the local fabric Python project installed editable. The
  build context is the repo root and the running container mounts the host repo over
  /workspace so notebook edits stay in sync with source files.

inputs:
  DATA_PATH:
    description: Host path for user notebook work (binds to /home/jovyan/work in container)
    required: true
  JUPYTER_PORT:
    default: 8888
    description: Host port to expose the Jupyter server (default 8888)
    required: false
  JUPYTER_TOKEN:
    default: localfabric-dev
    description: Auth token for the Jupyter server
    required: false

services:
  jupyter:
    build:
      context: ../../..
      dockerfile: 09_services/dev/jupyter/Dockerfile
    container_name: contentgraph-jupyter
    restart: unless-stopped
    ports:
      - map: "{{ JUPYTER_PORT }}:8888"
        description: Jupyter server HTTP interface
    environment:
      - map: JUPYTER_TOKEN: {{ JUPYTER_TOKEN }}
        description: Auth token for the Jupyter server
    volumes:
      - map: ../../..:/workspace
        description: Repo root bind-mounted for live editable install
      - map: {{ DATA_PATH }}:/home/jovyan/work
        description: User notebook work directory
    command:
      - start-notebook.py
      - --ServerApp.root_dir=/workspace/15_notebooks

files:
  - path: ./Dockerfile
    content: |
      FROM jupyter/base-notebook:latest

      USER root

      # Install the project editably at build time. The build context is the repo
      # root; the compose file sets it that way. Copying the repo into /workspace
      # and running pip install -e writes a .pth into /opt/conda's site-packages
      # that points at /workspace. At runtime the compose file bind-mounts the
      # host repo over /workspace, replacing this build-time copy with live source
      # while the .pth (in the image's site-packages, outside /workspace) keeps
      # pointing at /workspace — so imports resolve against the live mount and
      # edits flow both ways.
      COPY . /workspace
      RUN pip install --no-cache-dir -e "/workspace[notebook]" \
          && chown -R ${NB_UID}:${NB_GID} /workspace

      USER ${NB_UID}
