- id: docker.prometheus.service
  title: Prometheus Service
  description: |
    Prometheus metrics server scraping local fabric services. Loads its scrape config
    from ./config/prometheus.yml and persists TSDB data on DATA_PATH.
  tags:
  - docker
  - observability
  extends: docker.base
  inputs:
    DATA_PATH:
      type: string
      required: true
      description: Host path for the Prometheus TSDB (binds to /prometheus in container)
    PROMETHEUS_PORT:
      type: string
      required: false
      default: '9090'
      description: Host port to expose the Prometheus HTTP interface (default 9090)
  variables:
    services:
      prometheus:
        image: prom/prometheus
        container_name: contentgraph-prometheus
        restart: unless-stopped
        command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        ports:
        - '{{ PROMETHEUS_PORT }}:9090'
        volumes:
        - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - '{{ DATA_PATH }}:/prometheus'
    extra_files:
    - path: config/prometheus.yml
      content: |-
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ["localhost:9090"]
          - job_name: jaeger
            static_configs:
              - targets: ["jaeger:14269"]
