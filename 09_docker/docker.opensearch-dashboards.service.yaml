- id: docker.opensearch-dashboards.service
  title: OpenSearch Dashboards Service
  description: |
    OpenSearch Dashboards UI fronting the local OpenSearch cluster. Security dashboards
    plugin is disabled to match the dev-mode OpenSearch node.
  tags:
  - docker
  - search
  extends: docker.base
  inputs:
    OPENSEARCH_DASHBOARDS_PORT:
      type: string
      required: false
      default: '5601'
      description: Host port to expose OpenSearch Dashboards (default 5601)
    OPENSEARCH_HOSTS:
      type: string
      required: false
      default: '["http://opensearch:9200"]'
      description: JSON-encoded list of upstream OpenSearch hosts
  variables:
    services:
      opensearch-dashboards:
        image: opensearchproject/opensearch-dashboards:2
        container_name: contentgraph-opensearch-dashboards
        restart: unless-stopped
        environment:
          OPENSEARCH_HOSTS: '{{ OPENSEARCH_HOSTS }}'
          DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
        ports:
        - '{{ OPENSEARCH_DASHBOARDS_PORT }}:5601'
