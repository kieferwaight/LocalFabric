id: docker.gitea
name: gitea
category: dev
purpose: |
  Self-hosted Gitea git server with SQLite backend. Provides local Git hosting and
  Web UI for sharing repositories between local fabric services.

inputs:
  DATA_PATH:
    description: Host path for Gitea state (binds to /data in container)
    required: true
  GITEA_HTTP_PORT:
    default: 3000
    description: Host port to expose the Gitea HTTP interface (default 3000)
    required: false
  GITEA_SSH_PORT:
    default: 2222
    description: Host port to expose Gitea SSH (default 2222)
    required: false
  USER_UID:
    default: 1000
    description: UID for the Gitea container user (default 1000)
    required: false
  USER_GID:
    default: 1000
    description: GID for the Gitea container user (default 1000)
    required: false

services:
  gitea:
    image: gitea/gitea:latest
    container_name: contentgraph-gitea
    restart: unless-stopped
    environment:
      - map: USER_UID: {{ USER_UID }}
        description: UID for the Gitea container user
      - map: USER_GID: {{ USER_GID }}
        description: GID for the Gitea container user
      - map: GITEA__database__DB_TYPE: sqlite3
        description: Use SQLite as the Gitea database backend
    ports:
      - map: "{{ GITEA_HTTP_PORT }}:3000"
        description: Gitea HTTP interface
      - map: "{{ GITEA_SSH_PORT }}:22"
        description: Gitea SSH server
    volumes:
      - map: {{ DATA_PATH }}:/data
        description: Gitea persistent data directory
