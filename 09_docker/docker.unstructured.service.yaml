- id: docker.unstructured.service
  title: Unstructured Service
  description: |
    Unstructured.io API for partitioning documents into normalized elements. Used in the
    ingestion pipeline as an alternative or complement to Tika for layout-aware parsing.
  tags: [docker, document]
  extends: docker.base
  inputs:
    DATA_PATH:
      type: "string"
      required: true
      description: Host path for shared data (binds to /data in container)
    UNSTRUCTURED_PORT:
      type: "string"
      required: false
      default: "8001"
      description: Host port to expose the Unstructured API (default 8001)
  variables:
    services:
      unstructured:
        image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
        container_name: contentgraph-unstructured
        restart: unless-stopped
        ports:
          - "{{ UNSTRUCTURED_PORT }}:8000"
        volumes:
          - "{{ DATA_PATH }}:/data"
