- id: docker.tesseract-ocr
  title: Tesseract OCR Service
  description: |
    Tesseract OCR worker built atop a slim Python base with tesseract and poppler
    installed. Used to extract text from images and PDFs in the ingestion pipeline.
  tags: [docker, document]
  extends: docker.base
  inputs:
    DATA_PATH:
      type: "string"
      required: true
      description: Host path for OCR scratch storage (binds to /work in container)
  variables:
    image_tag: "contentgraph-tesseract-ocr:local"
    dockerfile_body: |
      FROM python:3.12-slim

      RUN apt-get update \
        && apt-get install -y --no-install-recommends tesseract-ocr poppler-utils \
        && rm -rf /var/lib/apt/lists/*

      WORKDIR /app
      COPY app /app
      CMD ["python", "worker.py"]
    services:
      tesseract-ocr:
        build: .
        image: contentgraph-tesseract-ocr:local
        container_name: contentgraph-tesseract-ocr
        restart: unless-stopped
        volumes:
          - "{{ DATA_PATH }}:/work"
    extra_files:
      - path: "app/worker.py"
        content: |
          import time


          print("tesseract OCR worker ready")
          while True:
              time.sleep(60)
