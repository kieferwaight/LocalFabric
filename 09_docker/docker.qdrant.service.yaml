- id: docker.qdrant.service
  title: Qdrant Service
  description: |
    Qdrant vector database for similarity search and embedding storage. Exposes both
    HTTP and gRPC APIs and persists collections under the bound data volume.
  tags:
  - docker
  - vector
  extends: docker.base
  inputs:
    DATA_PATH:
      type: string
      required: true
      description: Host path for Qdrant storage (binds to /qdrant/storage in container)
    QDRANT_HTTP_PORT:
      type: string
      required: false
      default: '6333'
      description: Host port to expose the Qdrant HTTP API (default 6333)
    QDRANT_GRPC_PORT:
      type: string
      required: false
      default: '6334'
      description: Host port to expose the Qdrant gRPC API (default 6334)
  variables:
    services:
      qdrant:
        image: qdrant/qdrant
        container_name: contentgraph-qdrant
        restart: unless-stopped
        ports:
        - '{{ QDRANT_HTTP_PORT }}:6333'
        - '{{ QDRANT_GRPC_PORT }}:6334'
        volumes:
        - '{{ DATA_PATH }}:/qdrant/storage'
