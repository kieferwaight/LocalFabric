id: docker.neo4j
name: neo4j
category: graph
purpose: |
  Neo4j 5 graph database used as the canonical content graph store. Bound data, logs,
  import, and plugins directories live under the configured data root for inspection.

inputs:
  DATA_PATH:
    description: Host root path containing data/, logs/, import/, and plugins/ subdirectories
    required: true
  NEO4J_PASSWORD:
    description: Password for the Neo4j user
    required: true
  NEO4J_USER:
    default: neo4j
    description: Neo4j auth username (default neo4j)
    required: false
  NEO4J_HTTP_PORT:
    default: 7474
    description: Host port for the Neo4j browser/HTTP API (default 7474)
    required: false
  NEO4J_BOLT_PORT:
    default: 7687
    description: Host port for the Neo4j Bolt protocol (default 7687)
    required: false

services:
  neo4j:
    image: neo4j:5
    container_name: contentgraph-neo4j
    restart: unless-stopped
    environment:
      - map: NEO4J_AUTH: {{ NEO4J_USER }}/{{ NEO4J_PASSWORD }}
        description: Neo4j initial auth in user/password form
      - map: NEO4J_server_memory_heap_initial__size: 512m
        description: Initial JVM heap size for Neo4j
      - map: NEO4J_server_memory_heap_max__size: 2G
        description: Maximum JVM heap size for Neo4j
    ports:
      - map: "{{ NEO4J_HTTP_PORT }}:7474"
        description: Neo4j browser/HTTP API
      - map: "{{ NEO4J_BOLT_PORT }}:7687"
        description: Neo4j Bolt protocol
    volumes:
      - map: {{ DATA_PATH }}/data:/data
        description: Neo4j graph data directory
      - map: {{ DATA_PATH }}/logs:/logs
        description: Neo4j logs directory
      - map: {{ DATA_PATH }}/import:/var/lib/neo4j/import
        description: Neo4j bulk import directory
      - map: {{ DATA_PATH }}/plugins:/plugins
        description: Neo4j plugins directory
