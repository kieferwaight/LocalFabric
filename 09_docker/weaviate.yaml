- id: docker.weaviate
  title: Weaviate Service
  description: |
    Weaviate vector database configured for anonymous access with no built-in vectorizer
    module. Embeddings are produced upstream and pushed in via the HTTP/gRPC APIs.
  tags: [docker, vector]
  extends: docker.base
  inputs:
    DATA_PATH:
      type: "string"
      required: true
      description: Host path for Weaviate persistence (binds to /var/lib/weaviate in container)
    WEAVIATE_HTTP_PORT:
      type: "string"
      required: false
      default: "8085"
      description: Host port to expose the Weaviate HTTP API (default 8085)
    WEAVIATE_GRPC_PORT:
      type: "string"
      required: false
      default: "50051"
      description: Host port to expose the Weaviate gRPC API (default 50051)
  variables:
    services:
      weaviate:
        image: semitechnologies/weaviate
        container_name: contentgraph-weaviate
        restart: unless-stopped
        environment:
          QUERY_DEFAULTS_LIMIT: "25"
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: node1
        ports:
          - "{{ WEAVIATE_HTTP_PORT }}:8080"
          - "{{ WEAVIATE_GRPC_PORT }}:50051"
        volumes:
          - "{{ DATA_PATH }}:/var/lib/weaviate"
