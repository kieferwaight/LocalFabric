- id: docker.pgvector
  title: pgvector Service
  description: |
    PostgreSQL with pgvector extension for vector similarity search. Used as the relational
    database scaffold for the content graph MVP, providing both structured data storage and
    vector search capabilities in a single system.
  tags: [docker, database]
  extends: docker.base
  inputs:
    DATA_PATH:
      type: "string"
      required: true
      description: Host path for PostgreSQL data storage (binds to /var/lib/postgresql/data in container)
    POSTGRES_USER:
      type: "string"
      required: true
      description: PostgreSQL superuser name
    POSTGRES_PASSWORD:
      type: "string"
      required: true
      description: PostgreSQL superuser password
    POSTGRES_DB:
      type: "string"
      required: true
      description: Initial PostgreSQL database name (default contentgraph)
    PGVECTOR_PORT:
      type: "string"
      required: false
      default: "5432"
      description: Host port to bind PostgreSQL client traffic (default 5432)
  variables:
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        container_name: contentgraph-pgvector
        restart: unless-stopped
        environment:
          POSTGRES_USER: "{{ POSTGRES_USER }}"
          POSTGRES_PASSWORD: "{{ POSTGRES_PASSWORD }}"
          POSTGRES_DB: "{{ POSTGRES_DB }}"
        ports:
          - "{{ PGVECTOR_PORT }}:5432"
        volumes:
          - "{{ DATA_PATH }}:/var/lib/postgresql/data"
          - "./init:/docker-entrypoint-initdb.d:ro"
    extra_files:
      - path: "init/01-init.sql"
        content: |
          CREATE EXTENSION IF NOT EXISTS vector;
