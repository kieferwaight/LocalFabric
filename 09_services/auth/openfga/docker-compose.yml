# Optional env: OPENFGA_HTTP_PORT (default 8083), OPENFGA_GRPC_PORT (default 8081), OPENFGA_PLAYGROUND_PORT (default 3003)
services:
  openfga:
    image: openfga/openfga
    container_name: contentgraph-openfga
    restart: unless-stopped
    command: run --playground-enabled --datastore-engine memory
    ports:
      - "${OPENFGA_HTTP_PORT:-8083}:8080"
      - "${OPENFGA_GRPC_PORT:-8081}:8081"
      - "${OPENFGA_PLAYGROUND_PORT:-3003}:3000"
