- id: builtin/git/init-current-workspace
  title: Initialize Current Git Workspace
  description: |
    Initializes the current working directory as a Git repository when needed.
  tags: [git]
  extends: abstract/base
  variables:
    repository_path: "{{ env.cwd }}"
    initial_branch: "main"
  docs:
    variables:
      repository_path: Directory to initialize.
      initial_branch: Initial branch name for a new repository.
    run:
      - title: Initialize repository
  run:
    - bash: |
        if git -C "{{ repository_path }}" rev-parse --git-dir >/dev/null 2>&1; then
          echo "Git repository already exists at {{ repository_path }}"
        else
          git -C "{{ repository_path }}" init -b "{{ initial_branch }}"
        fi

- id: builtin/git/gitignore-python
  title: Write Python Gitignore
  description: |
    Writes a Python-oriented `.gitignore` into the current workspace.
  tags: [git, files, templates]
  extends: builtin/files/write-text
  variables:
    target_path: "{{ env.cwd }}/.gitignore"
    content: |
      # Python
      __pycache__/
      *.py[cod]
      *.egg-info/
      .pytest_cache/
      .mypy_cache/
      .ruff_cache/
      .venv/
      venv/

      # Editors and operating system files
      .DS_Store
      .idea/
      .vscode/

      # Local secrets and output
      .env
      .env.*
      dist/
      build/
  docs:
    variables:
      target_path: Destination `.gitignore` path.
      content: Standard Python ignore patterns.

- id: builtin/git/create-github-repository
  title: Create GitHub Repository
  description: |
    Creates an `origin` GitHub repository through an authenticated GitHub CLI.
  tags: [git, github]
  extends: abstract/base
  inputs:
    repository_name:
      type: "string"
      required: true
      description: "GitHub repository name, optionally prefixed with owner/."
    visibility:
      type: "string"
      required: false
      default: "private"
      description: "Repository visibility: `public`, `private`, or `internal`."
    description:
      type: "string"
      required: false
      default: "Created from a LocalFabric YAML notebook."
      description: Description passed to GitHub CLI.
  variables:
    repository_path: "{{ env.cwd }}"
  docs:
    variables:
      repository_path: Local repository used as the GitHub source.
    run:
      - title: Create remote repository
  run:
    - bash: |
        case "{{ visibility }}" in
          public|private|internal) ;;
          *)
            echo "visibility must be public, private, or internal" >&2
            exit 2
            ;;
        esac
        command -v gh >/dev/null 2>&1 || {
          echo "GitHub CLI (gh) is required." >&2
          exit 127
        }
        git -C "{{ repository_path }}" rev-parse --git-dir >/dev/null 2>&1 || {
          echo "Initialize git before creating the GitHub repository." >&2
          exit 2
        }
        if git -C "{{ repository_path }}" remote get-url origin >/dev/null 2>&1; then
          echo "An origin remote already exists; skipping gh repo create." >&2
          exit 2
        fi
        gh repo create "{{ repository_name }}" \
          --source "{{ repository_path }}" \
          --"{{ visibility }}" \
          --description "{{ description }}" \
          --remote origin
