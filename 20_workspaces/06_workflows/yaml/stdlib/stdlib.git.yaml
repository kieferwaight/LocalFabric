- id: builtin/git/init-current-workspace
  extends: abstract/base
  variables:
    repository_path: "{{ env.cwd }}"
    initial_branch: "main"
  run:
    - bash: |
        if git -C "{{ repository_path }}" rev-parse --git-dir >/dev/null 2>&1; then
          echo "Git repository already exists at {{ repository_path }}"
        else
          git -C "{{ repository_path }}" init -b "{{ initial_branch }}"
        fi

- id: builtin/git/gitignore-python
  extends: builtin/files/write-text
  variables:
    target_path: "{{ env.cwd }}/.gitignore"
    content: |
      # Python
      __pycache__/
      *.py[cod]
      *.egg-info/
      .pytest_cache/
      .mypy_cache/
      .ruff_cache/
      .venv/
      venv/

      # Editors and operating system files
      .DS_Store
      .idea/
      .vscode/

      # Local secrets and output
      .env
      .env.*
      dist/
      build/

- id: builtin/git/create-github-repository
  extends: abstract/base
  inputs:
    repository_name:
      type: "string"
      required: true
      description: "GitHub repository name, optionally prefixed with owner/."
    visibility:
      type: "string"
      required: false
      default: "private"
    description:
      type: "string"
      required: false
      default: "Created from a LocalFabric YAML notebook."
  variables:
    repository_path: "{{ env.cwd }}"
  run:
    - bash: |
        case "{{ visibility }}" in
          public|private|internal) ;;
          *)
            echo "visibility must be public, private, or internal" >&2
            exit 2
            ;;
        esac
        command -v gh >/dev/null 2>&1 || {
          echo "GitHub CLI (gh) is required." >&2
          exit 127
        }
        git -C "{{ repository_path }}" rev-parse --git-dir >/dev/null 2>&1 || {
          echo "Initialize git before creating the GitHub repository." >&2
          exit 2
        }
        if git -C "{{ repository_path }}" remote get-url origin >/dev/null 2>&1; then
          echo "An origin remote already exists; skipping gh repo create." >&2
          exit 2
        fi
        gh repo create "{{ repository_name }}" \
          --source "{{ repository_path }}" \
          --"{{ visibility }}" \
          --description "{{ description }}" \
          --remote origin
