- id: builtin/template/render-markdown
  title: Render Markdown Template
  description: |
    Renders an authored Jinja Markdown template to a generated documentation target.
  tags: [templates, documentation]
  extends: abstract/base
  inputs:
    source_template:
      type: string
      required: true
      description: Path to the authored Markdown/Jinja template.
    target_path:
      type: string
      required: true
      description: Path to the generated Markdown file.
    mode:
      type: string
      required: false
      default: write
      description: Either `write` to render or `check` to verify committed output.
  run:
    - template:
        source_path: "{{ source_template }}"
        target_path: "{{ target_path }}"
        mode: "{{ mode }}"
  docs:
    run:
      - title: Render template asset
        description: |
          Uses the native template operation so Markdown rendering remains deterministic.
