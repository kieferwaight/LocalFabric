# Required env: DATA_PATH, NEO4J_PASSWORD
# Optional env: NEO4J_HTTP_PORT (default 7474), NEO4J_BOLT_PORT (default 7687), NEO4J_USER (default neo4j)
services:
  neo4j:
    image: neo4j:5
    container_name: contentgraph-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ${DATA_PATH}/data:/data
      - ${DATA_PATH}/logs:/logs
      - ${DATA_PATH}/import:/var/lib/neo4j/import
      - ${DATA_PATH}/plugins:/plugins
