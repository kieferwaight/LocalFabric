# Required env: DATA_PATH, POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
# Optional env: PGVECTOR_PORT (default 5432)
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: contentgraph-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-contentgraph}
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    volumes:
      - ${DATA_PATH}:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
