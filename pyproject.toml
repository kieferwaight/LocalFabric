[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localfabric"
version = "0.1.0"
description = "Local-first AI orchestration for models, tools, workflows, and data services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kiefer Waight" }]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "langgraph>=0.2",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.0", "google-generativeai>=0.5"]
vision = ["opencv-python>=4.8", "pytesseract>=0.3"]
pdf = ["pymupdf>=1.24", "pdfminer.six>=20221105", "pdf2image>=1.16"]
vector = ["lancedb>=0.6"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]
notebook = ["openai>=1.0", "ipykernel>=6.0"]

[project.scripts]
localfabric = "core.interfaces.cli.main:app"
localfabric-md = "core.interfaces.cli.markdown_runtime:main"
localfabric-mcp = "core.interfaces.mcp.server:main"
localfabric-api = "core.interfaces.api.app:cli_main"

[tool.setuptools]
# Map clean import names to the numbered on-disk buckets. Only five
# top-level Python aliases survive after the 02_core restructure:
# `core`, `interfaces` (the Protocol ABCs), `harnesses` (provider
# harnesses), `tasks` (atomic execution units; was `tools`), and
# `drivers`. Everything else has been pulled into core.* (router, mcp,
# cli, environment, runtimes.yaml, runtimes.markdown, runtimes.langgraph).
package-dir = { "interfaces" = "01_interfaces", "core" = "02_core", "harnesses" = "04_harnesses", "lib" = "07_lib", "drivers" = "08_drivers" }
packages = [
    "core",
    "core.environment",
    "core.router",
    "core.runtimes",
    "core.runtimes.yaml",
    "core.runtimes.yaml.src",
    "core.runtimes.markdown",
    "core.runtimes.markdown.providers",
    "core.runtimes.langgraph",
    "core.runtimes.langgraph.image_intelligence",
    "core.runtimes.langgraph.ingest",
    "core.runtimes.langgraph.markdown_format",
    "core.interfaces",
    "core.interfaces.commands",
    "core.interfaces.cli",
    "core.interfaces.mcp",
    "core.interfaces.api",
    "interfaces",
    "harnesses",
    "harnesses.claude",
    "harnesses.codex",
    "harnesses.gemini",
    "harnesses.lmstudio",
    "harnesses.ollama",
    "harnesses.openai",
    "lib",
    "lib.audit",
    "lib.browser",
    "lib.classify",
    "lib.research",
    "lib.embeddings",
    "lib.image",
    "lib.metadata",
    "lib.pdf",
    "lib.shell",
    "lib.text",
    "drivers",
    "drivers.cache",
    "drivers.file",
    "drivers.sql",
    "drivers.vector",
]

[tool.localfabric.workspace_manifest]
excluded_buckets = [
    "00_specs",
    "01_schemas",
    "06_workflows",
    "07_tasks",
    "09_docker",
    "09_launchd",
    "09_services",
    "12_prompts",
    "13_models",
    "13_providers",
    "14_data",
    "14_templates",
    "15_examples",
    "15_notebooks",
    "16_tests",
    "18_docs",
]

[tool.localfabric.mcp_mapping]
system_sdk_override = "core.interfaces.mcp"

[tool.localfabric.workspace_descriptions]
"00_specs" = "Agent-ready specs and task artifacts"
"01_interfaces" = "Python Protocol mirrors of the JSON schemas"
"01_schemas" = "Shared JSON schemas used across components"
"02_core" = "Core libraries — environment, router, runtimes (yaml/markdown/langgraph), interfaces (cli/api/mcp)"
"04_harnesses" = "Provider harnesses — execution lifecycle per model provider"
"06_workflows" = "Composed pipelines of tasks (YAML)"
"07_lib" = "Python helper library invoked by YAML tasks (image, pdf, embeddings, classify, research, …)"
"07_tasks" = "YAML task wrappers — one .task.yaml file per atomic lib.* function"
"08_drivers" = "Storage/database connectors"
"09_docker" = "Docker service definitions (extend docker.base)"
"09_launchd" = "macOS launchd job definitions (extend launchd.base)"
"09_services" = "Docker-Compose service catalog by category"
"12_prompts" = "Prompt templates (markdown runtime sources)"
"13_models" = "Per-model YAML registry (one file per model; declares providers and features)"
"13_providers" = "Per-provider YAML registry (one file per provider; declares protocols and endpoints)"
"14_data" = "Persistent data (filesystem-backed)"
"14_templates" = "Document templates rendered by YAML workflows"
"15_examples" = "Example YAML definitions showing runtime composition patterns"
"15_notebooks" = "Exploration notebooks"
"16_tests" = "Integration and contract tests"
"18_docs" = "Supporting docs"

[tool.pytest.ini_options]
testpaths = ["16_tests"]
python_files = ["*.test.py"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
