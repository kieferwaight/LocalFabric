- id: harness.stream-event.schema
  title: Harness Stream Event
  description: |
    Single event emitted by a harness's stream() method. Modeled loosely on the
    OpenAI/Anthropic streaming shape so adapters can normalize.
  tags: [schema, harness]
  extends: schemas.base
  schema:
    $id: https://scratch.local/schemas/harness.stream-event.schema.json
    title: StreamEvent
    description: Single event emitted by a harness's stream() method. Modeled loosely on the OpenAI/Anthropic streaming shape so adapters can normalize.
    required: [type]
    properties:
      type:
        type: string
        enum:
          - message_start
          - content_delta
          - tool_call_start
          - tool_call_delta
          - tool_call_end
          - message_stop
          - error
      delta:
        type: [string, "null"]
        description: Text delta for content_delta and tool_call_delta events.
      tool_call:
        type: [object, "null"]
        description: Set for tool_call_* events.
        properties:
          id:
            type: string
          name:
            type: string
          arguments:
            type: [object, string]
        additionalProperties: true
      stop_reason:
        type: [string, "null"]
        description: Set on message_stop. e.g. 'end_turn', 'tool_use', 'max_tokens'.
      error:
        type: [string, "null"]
        description: Set on error events.
      metadata:
        type: object
        additionalProperties: true
