# command.yaml — command-as-YAML contract
#
# Every CLI/API/MCP verb is a YAML definition that extends command.base.
# Three variable slots carry binding information read at registration time
# by interfaces/commands/registry.py and binder.py:
#
#   argv_spec   — Typer wiring: group, verb, positional inputs, option inputs
#   http_spec   — FastAPI wiring: method, path  (Phase C3)
#   mcp_spec    — FastMCP wiring: expose flag    (Phase C4)
#
# Children override these dicts entirely; individual fields within a dict
# can be selectively overridden because dict variables are deep-merged
# through the inheritance chain by the YAML runtime.

- id: command.base
  title: Abstract Command Base
  description: |
    Abstract base shared by all command definitions. Establishes the
    three variable slots (argv_spec, http_spec, mcp_spec) that
    interfaces/commands/binder.py reads to wire CLI / API / MCP handlers.
    This definition is never executed directly; it is only an ancestor.
  tags: [command, abstract]
  extends: stdlib.base
  variables:
    argv_spec: {}
    http_spec: {}
    mcp_spec:
      expose: false
  docs:
    variables:
      argv_spec: >
        CLI binding info consumed by binder.bind_typer().
        Shape: {group, verb, positional: [], options: []}.
      http_spec: >
        FastAPI binding info consumed by binder.bind_fastapi() (Phase C3).
        Shape: {method, path}.
      mcp_spec: >
        FastMCP exposure flag consumed by binder.bind_fastmcp() (Phase C4).
        Shape: {expose: bool}.

- id: command.task.run.command
  title: Run Task
  description: |
    Invoke a task definition by id, passing an optional arguments mapping.
    Wired as `localfabric task run <task_id>` on the CLI and as
    POST /v1/task/run on the API surface (Phase C3).
  tags: [command]
  extends: command.base
  inputs:
    task_id:
      type: string
      required: true
      description: Task definition id to invoke (must exist in the catalog).
    arguments:
      type: object
      required: false
      default: {}
      description: Arguments mapping passed through to the task.
  variables:
    argv_spec:
      group: task
      verb: run
      positional: [task_id]
      options: [arguments]
    http_spec:
      method: POST
      path: /v1/task/run
    mcp_spec:
      expose: true
  run:
    - invoke:
        definition: "{{ task_id }}"
        arguments: "{{ arguments }}"

- id: command.service.action.command
  title: Run a Service Lifecycle Action
  description: |
    Invokes a service definition (tagged `service`) with the given
    lifecycle verb. The service definition routes the verb to its
    backend's lifecycle wrapper (docker compose up/down/..., launchd
    start/stop/...).
    Wired as `localfabric service action <service_id> <action>` on the CLI
    and as POST /v1/service/action on the API surface (Phase C3).
  tags: [command]
  extends: command.base
  inputs:
    service_id:
      type: string
      required: true
      description: Service definition id (e.g. service.ollama.service). Must descend from service.base.
    action:
      type: string
      required: true
      description: One of start | stop | enable | disable | install | uninstall | status.
  variables:
    argv_spec:
      group: service
      verb: action
      positional: [service_id, action]
      options: []
    http_spec:
      method: POST
      path: /v1/service/action
    mcp_spec:
      expose: true
  run:
    - invoke:
        definition: "{{ service_id }}"
        arguments:
          action: "{{ action }}"

- id: command.route.command
  title: Route an Intent through the Router
  description: |
    Classifies the free-text task, scores candidate routes, and dispatches
    the winner via the YAML runtime.
    Wired as `localfabric route run <task>` on the CLI and as
    POST /v1/route on the API surface (Phase C3).
  tags: [command]
  extends: command.base
  inputs:
    task:
      type: string
      required: true
      description: Free-text intent from the user.
    context:
      type: object
      required: false
      default: {}
      description: Optional structured context.
  variables:
    argv_spec:
      group: route
      verb: run
      positional: [task]
      options: [context]
    http_spec:
      method: POST
      path: /v1/route
    mcp_spec:
      expose: false
  run:
    - python: |
        # Bridge: invoke the Python router from inside the YAML runtime.
        import json, os, sys
        sys.path.insert(0, "02_core")
        from core.router.router import Router  # noqa
        from core.runtimes.yaml.src import Runtime  # noqa: F401
        # Note: the bridge approach is intentional — `command.route.command` is
        # the user-facing wrapper; the Router class composes
        # classifier/scorer/dispatcher and itself calls runtime.execute
        # on the chosen route. We pass a fresh Runtime instance the Router
        # constructs internally rather than threading the current scope.
        router = Router()
        result = router.route(task="{{ task }}", context={{ context | tojson }})
        with open(os.environ["STATE_FILE"], "w") as f:
            json.dump({"dispatch_result": str(result)}, f, default=str)
