- id: stdlib.python.barrel.template
  title: Python Barrel - __init__.py Template
  description: |
    Renders a package's `__init__.py` from the module list produced by
    `python_packages.scan_package`. One `from .X import (...)` block per
    sibling module or subpackage, followed by an aggregate `__all__`.
    Module sections appear in the order the scanner returns them
    (alphabetical by name), and exports within a module preserve declaration
    order so reviewers see the public surface as the author wrote it.
  tags:
  - python
  - template
  inputs:
    package_name:
      type: string
      required: true
      description: Name of the package being generated, used in the docstring.
    package_doc:
      type: string
      required: false
      default: ''
      description: Optional one-line docstring summary placed at the top.
    modules:
      type: array
      required: true
      description: |
        Output of `python_packages.scan_package`. Each entry is a dict with
        `name`, `is_subpackage`, `docstring`, and `exports`.
    flatten:
      type: boolean
      required: false
      default: true
      description: |
        When true (the default), re-exports every symbol from every scanned
        module so callers can `from <pkg> import Name` directly — appropriate
        when the children are implementation details. When false, exposes
        each child as its own namespace via `from . import child` — the right
        choice for a top-level package whose children are distinct domains
        and whose symbols may collide.
  template:
    engine: jinja
    output: text
    body: |
      """{{ package_doc or 'Public surface for `' ~ package_name ~ '` — auto-generated by stdlib.python.barrel.' }}
      Do not edit by hand. Regenerate with:
          python interpreter.py 06_workflows/barrels.regenerate.workflow.yaml barrels.regenerate.yaml-runtime.workflow --mode=write
      """
      {% if flatten %}
      {% for module in modules if module.exports %}
      from .{{ module.name }} import (
      {%- for name in module.exports %}
          {{ name }},
      {%- endfor %}
      )
      {% endfor %}
      __all__ = [
      {%- for module in modules if module.exports %}
      {%- for name in module.exports %}
          "{{ name }}",
      {%- endfor %}
      {%- endfor %}
      ]
      {% else %}
      from . import (
      {%- for module in modules %}
          {{ module.name }},
      {%- endfor %}
      )
      __all__ = [
      {%- for module in modules %}
          "{{ module.name }}",
      {%- endfor %}
      ]
      {% endif %}
- id: stdlib.python.barrel.task
  title: Generate Python Barrel
  description: |
    Scans `package_dir` for direct sibling modules and subpackages, then
    renders their public surface into `<package_dir>/__init__.py` via
    `stdlib.python.barrel.template`. Honors `mode: check` so CI can detect
    drift the same way the docs workflow does.
    Modules declaring an `__all__` are treated as the source of truth.
    Modules without `__all__` fall back to every top-level non-underscore
    `class`/`def`/assignment — the standard Python "public-by-default"
    convention. Modules with neither pattern (empty inferred surface) are
    dropped.
  tags:
  - python
  - generator
  extends: stdlib.base
  inputs:
    package_dir:
      type: string
      required: true
      description: Absolute path to the Python package whose barrel to regenerate.
    package_doc:
      type: string
      required: false
      default: ''
      description: Optional one-line docstring summary placed at the top of __init__.py.
    mode:
      type: string
      required: false
      default: write
      description: Either `write` to regenerate output or `check` to assert it's current.
    exclude:
      type: array
      required: false
      default: []
      description: |
        Module names to skip — typically CLI entry points or scripts that
        live in the package dir but aren't part of its public API.
    flatten:
      type: boolean
      required: false
      default: true
      description: |
        Forwarded to the template. `true` re-exports every symbol from every
        child; `false` exposes children as namespaces. See the template's own
        docs for when each is appropriate.
    yaml_analysis_src:
      type: string
      required: false
      default: '{{ runtime.workflow_dir }}/src'
      description: |
        Directory containing the `python_packages` module. Defaults to the
        workflow's own `src/` so this definition bootstraps from inside this
        bucket; override when generating barrels for an unrelated package.
  docs:
    run:
    - title: Scan package and stash module list
    - title: Render __init__.py
  run:
  - python: |
      import json
      import os
      import sys
      from pathlib import Path
      sys.path.insert(0, "{{ yaml_analysis_src }}")
      from python_packages import scan_package
      exclude = {{ exclude | tojson }}
      modules = scan_package(Path("{{ package_dir }}"), exclude=exclude)
      package_name = os.path.basename(os.path.abspath("{{ package_dir }}")) or "package"
      state_file = os.environ["STATE_FILE"]
      with open(state_file, "w", encoding="utf-8") as fh:
          json.dump({"barrel_modules": modules, "barrel_package_name": package_name}, fh)
  - render:
      definition: stdlib.python.barrel.template
      arguments:
        package_name: '{{ barrel_package_name }}'
        package_doc: '{{ package_doc }}'
        modules: '{{ barrel_modules }}'
        flatten: '{{ flatten }}'
      target_path: '{{ package_dir }}/__init__.py'
      mode: '{{ mode }}'
