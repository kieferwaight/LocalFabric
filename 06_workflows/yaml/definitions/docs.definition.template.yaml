- id: docs.definition.template.component-relationship-graph
  title: Docs - Relationship Graph Component
  description: |
    Mermaid relationship subgraph for a single definition page. Renders the
    target definition with its parent (`extends`), mixins, and children using
    a horizontal layout so wide trees (many children) stay readable.
  tags: [documentation, template, component]
  inputs:
    definition:
      type: object
      required: true
      description: Catalog entry whose relationships are rendered.
    direction:
      type: string
      required: false
      default: LR
      description: Mermaid flowchart direction. `LR` is horizontal; `TD` is vertical.
  template:
    engine: jinja
    output: markdown
    body: |
      ```mermaid
      flowchart {{ direction }}
        {{ definition.mermaid_id }}["{{ definition.title }}"]
      {% if definition.parent -%}
        {{ definition.mermaid_id }} --> {{ definition.parent.mermaid_id }}["{{ definition.parent.title }}"]
      {% endif -%}
      {% for item in definition.mixin_links -%}
        {{ definition.mermaid_id }} -.-> {{ item.mermaid_id }}["{{ item.title }}"]
      {% endfor -%}
      {% for item in definition.child_links -%}
        {{ item.mermaid_id }}["{{ item.title }}"] --> {{ definition.mermaid_id }}
      {% endfor -%}
      ```

- id: docs.definition.template.index
  title: Docs - Index Page Template
  description: |
    Top-level YAML API reference page. Lists every definition in the catalog,
    groups them by tag, and renders two relationship overview graphs.
  tags: [documentation, template]
  template:
    engine: jinja
    output: markdown
    body: |
      {{ runtime.catalog.generated_marker }}
      # YAML API Reference

      This reference is generated by the `docs/api/reference` YAML workflow. It describes the
      standard library, runnable examples, and the documentation workflow itself.

      Regenerate or verify committed output from `06_workflows/yaml/`:

      ```bash
      python interpreter.py config.yaml docs/api/reference --output_dir=docs --mode=write
      python interpreter.py config.yaml docs/api/reference --output_dir=docs --mode=check
      ```

      See the [definition authoring schema](schema.md) for metadata and composition fields.

      ## Definitions

      | Definition | ID | Source | Tags |
      | --- | --- | --- | --- |
      {% for item in runtime.catalog.definitions -%}
      | [{{ item.title }}]({{ item.page_path }}) | `{{ item.id }}` | `{{ item.source_path }}` | {{ item.tags | join(", ") or "-" }} |
      {% endfor %}

      ## Tags

      {% for tag in runtime.catalog.tags -%}
      ### {{ tag.name }}

      {% for item in tag.definitions -%}
      - [{{ item.title }}]({{ item.page_path }}) (`{{ item.id }}`)
      {% endfor %}

      {% endfor -%}
      ## Relationship Graph

      Solid arrows identify `extends`; dashed arrows identify mixin use.

      ```mermaid
      flowchart TD
      {% for item in runtime.catalog.definitions -%}
        {{ item.mermaid_id }}["{{ item.title }}"]
      {% if item.extends -%}
        {{ item.mermaid_id }} --> {{ ("def_" + item.extends | replace("/", "_") | replace("-", "_")) }}
      {% endif -%}
      {% for mixin in item.mixins -%}
        {{ item.mermaid_id }} -.-> {{ ("def_" + mixin | replace("/", "_") | replace("-", "_")) }}
      {% endfor -%}
      {% endfor -%}
      ```

      ## Module Imports

      ```mermaid
      flowchart LR
      {% for item in runtime.catalog.definitions -%}
      {% for module in item.modules -%}
        {{ item.mermaid_id }}["{{ item.id }}"] --> {{ item.mermaid_id }}_module_{{ loop.index }}["{{ module }}"]
      {% endfor -%}
      {% endfor -%}
      ```

- id: docs.definition.template.schema
  title: Docs - Authoring Schema Page Template
  description: |
    Reference for the YAML definition authoring schema; fields, structured
    operations, and resolution rules.
  tags: [documentation, template]
  template:
    engine: jinja
    output: markdown
    body: |
      {{ runtime.catalog.generated_marker }}
      # YAML Definition Authoring Schema

      The YAML workflow engine treats each list entry as a definition. Documentation metadata is
      optional and never changes execution behavior.

      ## Documented Definition

      ```yaml
      - id: stdlib.files.write-text
        title: Write Text File
        description: |
          Writes rendered UTF-8 content to a target path.
        tags: [files, templates]
        extends: stdlib.base
        inputs:
          target_path:
            type: string
            required: true
            description: Output path.
        variables:
          content: ""
        docs:
          variables:
            content: Text to write.
          run:
            - title: Write rendered content
              description: |
                Creates missing parent directories.
        run:
          - python: |
              print("operation")
      ```

      ## Fields

      | Field | Purpose |
      | --- | --- |
      | `id` | Required canonical identifier and generated page path. |
      | `title` | Optional human-readable page title; falls back to `id`. |
      | `description` | Optional Markdown description, commonly authored with `|`. |
      | `tags` | Optional labels used in generated navigation. |
      | `extends` | One parent definition inherited before local values. |
      | `mixins` | Ordered reusable definitions; later mixins override earlier values. |
      | `modules` | Relative YAML files loaded into the registry. |
      | `inputs` | Typed parameters: `string`, `number`, `boolean`, `array`, or `object`. |
      | `variables` | Rendered scope values and templates. |
      | `run` / `teardown` | Lifecycle operations. |
      | `template` | Optional inline template (`engine`, `output`, `body`) that turns the definition into a renderable component. |
      | `docs` | Optional descriptions for local variables and lifecycle operations. |

      ## Structured Operations

      `invoke` calls another definition and may iterate a native collection:

      ```yaml
      {% raw -%}
      - invoke:
          definition: docs.definition.template.definition
          arguments:
            definition: "{{ definition }}"
        for_each:
          items: runtime.catalog.definitions
          as: definition
      {% endraw -%}
      ```

      `render` calls a template definition (any definition with a `template:` block) and writes
      its rendered output to `target_path` in either `write` or `check` mode:

      ```yaml
      {% raw -%}
      - render:
          definition: docs.definition.template.definition
          arguments:
            definition: "{{ definition }}"
          target_path: "{{ output_dir }}/{{ definition.page_path }}"
          mode: "{{ mode }}"
        for_each:
          items: runtime.catalog.definitions
          as: definition
      {% endraw -%}
      ```

      Inside a template body, the `component('definition-id', **kwargs)` Jinja helper renders
      another template definition and returns its string output for inline composition.

      The `generated_pages` operation reconciles obsolete generated definition pages. The
      `artifact` operation delegates text and directory persistence to the artifact driver.

      ## Resolution Rules

      Inputs and variables resolve in order: parent, mixins in declared order, then local values.
      A non-empty local `run` or `teardown` replaces inherited lifecycle operations. Generated
      definition pages show both declared members and this effective resolved API.

- id: docs.definition.template.definition
  title: Docs - Definition Page Template
  description: |
    Markdown page describing a single definition: metadata table, relationship
    summary, mermaid relationship-graph component, declared API, and resolved
    API after inheritance and mixin merge.
  tags: [documentation, template]
  inputs:
    definition:
      type: object
      required: true
      description: Catalog entry to render.
  template:
    engine: jinja
    output: markdown
    body: |
      {{ runtime.catalog.generated_marker }}
      # {{ definition.title }}

      [API index]({{ definition.index_link }}) | [Definition schema]({{ definition.schema_link }})

      | Field | Value |
      | --- | --- |
      | ID | `{{ definition.id }}` |
      | Source | `{{ definition.source_path }}` |
      | Tags | {{ definition.tags | join(", ") or "-" }} |

      {{ definition.description or "_No description provided._" }}

      ## Relationships

      | Relation | Definitions |
      | --- | --- |
      | Extends | {% if definition.parent %}[{{ definition.parent.title }}]({{ definition.parent.link }}){% else %}-{% endif %} |
      | Mixins | {% if definition.mixin_links %}{% for item in definition.mixin_links %}[{{ item.title }}]({{ item.link }}){% if not loop.last %}, {% endif %}{% endfor %}{% else %}-{% endif %} |
      | Children | {% if definition.child_links %}{% for item in definition.child_links %}[{{ item.title }}]({{ item.link }}){% if not loop.last %}, {% endif %}{% endfor %}{% else %}-{% endif %} |
      | Mixin consumers | {% if definition.consumer_links %}{% for item in definition.consumer_links %}[{{ item.title }}]({{ item.link }}){% if not loop.last %}, {% endif %}{% endfor %}{% else %}-{% endif %} |
      | Modules | {% if definition.modules %}{% for module in definition.modules %}`{{ module }}`{% if not loop.last %}, {% endif %}{% endfor %}{% else %}-{% endif %} |

      {{ component('docs.definition.template.component-relationship-graph', definition=definition) }}

      ## Declared API

      ### Inputs

      | Name | Type | Required | Default | Description |
      | --- | --- | --- | --- | --- |
      {% for item in definition.declared.inputs -%}
      | `{{ item.name }}` | `{{ item.type }}` | {{ "yes" if item.required else "no" }} | `{{ item.default if item.default is not none else "-" }}` | {{ item.description or "-" }} |
      {% else -%}
      | - | - | - | - | No locally declared inputs. |
      {% endfor %}

      ### Variables

      | Name | YAML Type | Value / Template | Description |
      | --- | --- | --- | --- |
      {% for item in definition.declared.variables -%}
      | `{{ item.name }}` | `{{ item.type }}` | `{{ item.value | string | replace("\n", " ") | replace("|", "\\|") }}` | {{ item.description or "-" }} |
      {% else -%}
      | - | - | - | No locally declared variables. |
      {% endfor %}

      ### Run Operations

      {% for item in definition.declared.run -%}
      #### {{ item.title or (item.operation | title) }}

      {{ item.description or "_No operation description provided._" }}

      ```{{ item.operation }}
      {{ item.source }}
      ```

      {% else -%}
      _No locally declared run operations._

      {% endfor -%}
      ### Teardown Operations

      {% for item in definition.declared.teardown -%}
      #### {{ item.title or (item.operation | title) }}

      {{ item.description or "_No operation description provided._" }}

      ```{{ item.operation }}
      {{ item.source }}
      ```

      {% else -%}
      _No locally declared teardown operations._

      {% endfor -%}
      ## Resolved API

      ### Effective Inputs

      | Name | Type | Required | Default | Origin |
      | --- | --- | --- | --- | --- |
      {% for item in definition.resolved.inputs -%}
      | `{{ item.name }}` | `{{ item.type }}` | {{ "yes" if item.required else "no" }} | `{{ item.default if item.default is not none else "-" }}` | [{{ item.origin_title }}]({{ item.origin_link }}) |
      {% else -%}
      | - | - | - | - | No effective inputs. |
      {% endfor %}

      ### Effective Variables

      | Name | Value / Template | Origin |
      | --- | --- | --- |
      {% for item in definition.resolved.variables -%}
      | `{{ item.name }}` | `{{ item.value | string | replace("\n", " ") | replace("|", "\\|") }}` | [{{ item.origin_title }}]({{ item.origin_link }}) |
      {% else -%}
      | - | - | No effective variables. |
      {% endfor %}

      ### Effective Lifecycle

      | Phase | Operation | Origin |
      | --- | --- | --- |
      {% for item in definition.resolved.run -%}
      | Run | `{{ item.operation }}` | [{{ item.origin_title }}]({{ item.origin_link }}) |
      {% endfor -%}
      {% for item in definition.resolved.teardown -%}
      | Teardown | `{{ item.operation }}` | [{{ item.origin_title }}]({{ item.origin_link }}) |
      {% endfor -%}
      {% if not definition.resolved.run and not definition.resolved.teardown -%}
      | - | - | No effective lifecycle operations. |
      {% endif -%}
