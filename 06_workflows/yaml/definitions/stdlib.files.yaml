- id: stdlib.files.write-text
  title: Write Text File
  description: |
    Writes rendered UTF-8 text and restores escaped template markers.
  tags: [files, templates]
  extends: stdlib.base
  variables:
    target_path: ""
    content: ""
  docs:
    variables:
      target_path: Output path for the generated text file.
      content: Text content to write.
    run:
      - title: Write text
        description: |
          Creates missing parent directories and writes UTF-8 content.
  run:
    - artifact:
        action: write_text
        target_path: "{{ target_path }}"
        content: "{{ content }}"
        restore_template_markers: true

- id: stdlib.files.create-directory
  title: Create Directory
  description: |
    Creates a directory and any missing parent directories.
  tags: [files]
  extends: stdlib.base
  inputs:
    directory_path:
      type: "string"
      required: true
      description: Directory path to create.
  docs:
    run:
      - title: Create directory tree
  run:
    - artifact:
        action: create_directory
        target_path: "{{ directory_path }}"
