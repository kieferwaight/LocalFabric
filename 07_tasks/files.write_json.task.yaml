- id: files.write_json.task
  title: Write data to a JSON file
  description: |
    Write a data object as indented JSON to a file, creating parent
    directories as needed. Wraps lib.files.write_json.
  tags: [task]
  extends: task.base
  inputs:
    path:
      type: string
      required: true
      description: Output file path.
    data:
      type: object
      required: true
      description: Data object to serialize as JSON.
  run:
    - python: |
        import json, os
        from pathlib import Path
        from lib.files import write_json

        data = {{ data | tojson }}
        write_json(Path("{{ path }}"), data)
        with open(os.environ["STATE_FILE"], "w") as f:
            json.dump({"path": "{{ path }}"}, f)
