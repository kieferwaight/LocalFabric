- id: document.text.example-passage.001.dataset
  title: Example prose passage (plain text)
  description: |
    Short two-paragraph descriptive prose passage. Useful for embedding,
    chunking, summarization, and language-detection regression tests on
    naturalistic English with no markup.
  tags:
  - dataset
  - document
  - text
  - prose
  - dummy
  extends: stdlib.base

  class: document
  subclass: text

  media:
    path: example-passage.001.txt
    sha256: '4bfdad95e00b1c592139b8317decd689a75fcc580fdf03e2c7c8f8bb277358bf'
    bytes: 546
    mime: text/plain
    word_count: 98
    line_count: 9
