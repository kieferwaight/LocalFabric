    origin: generated
    license: CC0-1.0
    captured: '2026-05-26'
    attribution: 'Synthetic dummy fixture generated for the test-data corpus.'

  determinism:
    pinned: true

  labels:
    style:
      register: descriptive
      paragraphs: 2

  uses:
