- id: git.init.example
  title: Initialize Git Example
  description: |
    Composes local repository initialization with a reusable Python gitignore.
  tags: [example, git]
  mixins:
    - stdlib.git.init-current-workspace.task
    - stdlib.git.gitignore-python.task

- id: git.github.example
  title: GitHub Repository Example
  description: |
    Initializes local Git files and creates a matching remote GitHub repository.
  tags: [example, git, github]
  mixins:
    - stdlib.git.init-current-workspace.task
    - stdlib.git.gitignore-python.task
    - stdlib.git.create-github-repository.task

- id: git.gitignore.example
  title: Gitignore Template Example
  description: |
    Writes the standard Python `.gitignore` template in the active workspace.
  tags: [example, git, templates]
  extends: stdlib.git.gitignore-python.task
