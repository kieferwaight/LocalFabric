id: audit-classifications
title: Audit classification boundaries and ownership
description: |-
  Audit classification boundaries and ownership. This workflow analyzes files
  in the repository to identify potential violations of responsibility boundaries.
run:
  python: |
    """Find responsibility-boundary violations in the numeric workspace layout.

    This is a planning audit. It emits one JSON object per finding and deliberately
    does not rewrite production modules. Rules are conservative and evidence-based:
    they capture known boundary leaks that an implementation agent can review.
    """

    from __future__ import annotations

    import argparse
    import hashlib
    import json
    from collections import Counter
    from datetime import datetime, timezone
    from pathlib import Path
    from typing import Any, Iterable


    AUDITED_SUFFIXES = {".py", ".sh", ".yaml", ".yml", ".json", ".md"}
    EXCLUDED_PARTS = {"__pycache__", ".pytest_cache", ".venv"}
    # Persistent generated output and explicitly archived legacy code are not
    # candidates for active ownership remediation.
    EXCLUDED_BUCKETS = {"14_data", "19_archive"}
    SCAN_SCOPE = "repo source, configuration, documentation, and workflow files"
    VALID_STATUSES = {"open", "accepted", "in_progress", "resolved", "dismissed"}


    def _bucket(path: Path, workspace: Path) -> str:
        rel = path.relative_to(workspace)
        first = rel.parts[0]
        return first if len(first) > 2 and first[:2].isdigit() else "workspace_root"


    def _lines_with(text: str, needles: Iterable[str], limit: int = 4) -> list[dict[str, Any]]:
        evidence: list[dict[str, Any]] = []
        matched: set[str] = set()
        for line_number, line in enumerate(text.splitlines(), start=1):
            for needle in needles:
                if needle in line and needle not in matched:
                    evidence.append({"line": line_number, "excerpt": line.strip()[:180]})
                    matched.add(needle)
                    break
            if len(evidence) >= limit:
                break
        return evidence


    def _finding(
        path: Path,
        workspace: Path,
        generated_at: str,
        rule: str,
        severity: str,
        summary: str,
        evidence: list[dict[str, Any]],
        decomposition_classes: list[dict[str, str]],
        remediation_guidance: list[str],
        related_files: list[Path] | None = None,
        confidence: float = 0.9,
    ) -> dict[str, Any]:
        identity = f"{path.resolve()}::{rule}".encode("utf-8")
        finding_id = "CAF-" + hashlib.sha256(identity).hexdigest()[:12].upper()
        return {
            "schema_version": "1.0",
            "finding_id": finding_id,
            "generated_at": generated_at,
            "file": str(path.resolve()),
            "source_bucket": _bucket(path, workspace),
            "violation": {
                "code": rule,
                "severity": severity,
                "summary": summary,
                "evidence": evidence,
                "confidence": confidence,
            },
            "decomposition_classes": decomposition_classes,
            "related_files": [str(item.resolve()) for item in related_files or []],
            "remediation_guidance": remediation_guidance,
            "status": "open",
            "detector": {"rule": rule, "scan_scope": SCAN_SCOPE},
        }


    def _target(class_name: str, destination: str, responsibility: str, naming: str) -> dict[str, str]:
        return {
            "class": class_name,
            "destination": destination,
            "responsibility": responsibility,
            "naming_guidance": naming,
        }


    def iter_audited_files(workspace: Path, output_dir: Path) -> list[Path]:
        files: list[Path] = []
        for path in workspace.rglob("*"):
            if not path.is_file() or path.suffix.lower() not in AUDITED_SUFFIXES:
                continue
            if (
                output_dir in path.parents
                or any(part in EXCLUDED_PARTS for part in path.parts)
                or _bucket(path, workspace) in EXCLUDED_BUCKETS
            ):
                continue
            files.append(path)
        return sorted(files)


    def audit_file(path: Path, workspace: Path, generated_at: str) -> list[dict[str, Any]]:
        text = path.read_text(encoding="utf-8", errors="replace")
        rel = path.relative_to(workspace).as_posix()
        findings: list[dict[str, Any]] = []

        if rel.startswith("12_prompts/") and path.suffix == ".py":
            evidence = _lines_with(text, ["urllib.request", "subprocess.run", "api_url =", "prompt ="])
            if evidence:
                prompt_name = path.stem.replace("extract-visible-", "").replace("-from-image", "")
                findings.append(
                    _finding(
                        path,
                        workspace,
                        generated_at,
                        "executable_provider_wrapper_in_prompt_bucket",
                        "high",
                        "Prompt storage contains executable provider/client logic instead of a provider-agnostic prompt asset.",
                        evidence,
                        [
                            _target(
                                "12_prompts",
                                f"12_prompts/{prompt_name}.md",
                                "Retain only task instructions and expected output format as a template.",
                                "Use flat dot-notation filenames (e.g. tasks.vision.overview.md) with an 'id' in frontmatter matching the stem.",
                            ),
                            _target(
                                "04_harnesses",
                                "04_harnesses/ollama/harness.py",
                                "Own Ollama request execution, model options, errors, and readiness behavior.",
                                "Extend the existing provider harness rather than create task-named clients.",
                            ),
                            _target(
                                "06_workflows",
                                "06_workflows/langgraph/image_intelligence/",
                                "Load named prompt tasks and sequence vision analysis calls.",
                                "Workflow nodes describe steps, not provider-specific scripts.",
                            ),
                        ],
                        [
                            "Extract prompt content first and freeze its intended output contract.",
                            "Route all provider calls through the shared Ollama harness before deleting this wrapper.",
                            "Replace callers that execute this file with workflow or adapter entry points.",
                        ],
                    )
                )

        provider_markers = ["ChatOllama", "import ollama", ".embeddings(", "ollama.generate("]
        if rel.startswith("07_tools/") and any(marker in text for marker in provider_markers):
            evidence = _lines_with(text, provider_markers + ["_PROMPT", "prompt ="])
            extra_targets: list[dict[str, str]] = []
            if any(marker in text for marker in ["_PROMPT", "system_prompt", "user_prompt", "prompt = (", "prompt = \"\"\""]):
                extra_targets.append(
                    _target(
                        "12_prompts",
                        "12_prompts/",
                        "Extract task instructions or output formatting embedded in the tool.",
                        "Use task-purpose template names rather than provider names.",
                    )
                )
            if "cache" in text.lower():
                extra_targets.append(
                    _target(
                        "08_drivers",
                        "08_drivers/cache/",
                        "Own persistent embedding/cache read and write behavior.",
                        "Name drivers for the backing store or cached data contract.",
                    )
                )
            findings.append(
                _finding(
                    path,
                    workspace,
                    generated_at,
                    "provider_execution_in_tool_bucket",
                    "high",
                    "Reusable tool code directly invokes a model provider, coupling task functionality to an execution backend.",
                    evidence,
                    [
                        _target(
                            "07_tools",
                            str(Path(rel).parent / "analyze.py"),
                            "Keep provider-neutral task operations and typed input/output handling.",
                            "Use capability names such as analyze.py or embed.py, not provider client names.",
                        ),
                        _target(
                            "04_harnesses",
                            "04_harnesses/ollama/harness.py",
                            "Perform Ollama invocations, error translation, availability checks, and request options.",
                            "Provider integrations remain under the existing provider harness package.",
                        ),
                        *extra_targets,
                    ],
                    [
                        "Define the tool input/output contract before changing imports.",
                        "Inject or invoke a harness from the workflow/router layer rather than importing the provider SDK here.",
                        "Add tests proving the tool contract remains stable when the execution provider changes.",
                    ],
                )
            )

        if rel.startswith("03_adapters/") and "ollama_api" in text and "httpx." in text:
            findings.append(
                _finding(
                    path,
                    workspace,
                    generated_at,
                    "provider_health_probe_in_adapter",
                    "medium",
                    "CLI adapter performs a provider-specific health/model query instead of using harness status.",
                    _lines_with(text, ["import httpx", "httpx.get", "vision_model"]),
                    [
                        _target(
                            "04_harnesses",
                            "04_harnesses/ollama/harness.py",
                            "Expose model availability and health/status checks.",
                            "Keep provider-specific status behavior on OllamaHarness.",
                        ),
                        _target(
                            "03_adapters",
                            rel,
                            "Format status output and CLI warnings from normalized harness results.",
                            "CLI modules may present results but should not call provider endpoints.",
                        ),
                    ],
                    [
                        "Add a harness-level capability check returning normalized status metadata.",
                        "Replace direct HTTP preflight with that contract and keep only Rich presentation here.",
                    ],
                )
            )

        if rel.startswith("11_mcp/tools/") and path.suffix == ".py" and (
            "ollama." in text or "import ollama" in text
        ):
            findings.append(
                _finding(
                    path,
                    workspace,
                    generated_at,
                    "mcp_tool_combines_provider_prompt_and_fetch_execution",
                    "high",
                    "MCP-facing tool combines web acquisition, embedded prompts, model selection, provider execution, and subprocess work.",
                    _lines_with(text, ["import ollama", "requests.get", "system_prompt", "ollama.generate(", "subprocess.run"]),
                    [
                        _target(
                            "11_mcp",
                            rel,
                            "Expose thin MCP tool registration and translate connector inputs/outputs.",
                            "Keep exported MCP functions small and orchestration-free.",
                        ),
                        _target(
                            "07_tools",
                            "07_tools/browser/fetch_text.py",
                            "Fetch and clean source text as a reusable functional unit.",
                            "Use a capability-oriented module name independent of MCP.",
                        ),
                        _target(
                            "12_prompts",
                            "12_prompts/tasks.research-summary.md",
                            "Store local research summarization instructions.",
                            "Use provider-agnostic task templates.",
                        ),
                        _target(
                            "04_harnesses",
                            "04_harnesses/ollama/harness.py",
                            "Select/invoke local models and normalize provider failures.",
                            "Reuse OllamaHarness and registry-backed model configuration.",
                        ),
                    ],
                    [
                        "Separate fetch, prompt selection, and model execution before updating MCP registration.",
                        "Preserve the MCP public tool result contract while delegating internally.",
                    ],
                )
            )

        if rel.startswith("06_workflows/") and "12_prompts/" in text and ".py" in text:
            findings.append(
                _finding(
                    path,
                    workspace,
                    generated_at,
                    "workflow_executes_prompt_bucket_as_scripts",
                    "high",
                    "Workflow executes Python programs from the prompt-template bucket, preserving a legacy ownership boundary.",
                    _lines_with(text, ["12_prompts/", "extract-visible-overview", "extract-visible-layout", "extract-visible-style"]),
                    [
                        _target(
                            "06_workflows",
                            rel,
                            "Orchestrate reusable tool/harness calls and aggregate output.",
                            "Workflow files reference task identifiers, not executable prompt paths.",
                        ),
                        _target(
                            "12_prompts",
                            "12_prompts/",
                            "Provide prompt assets loaded by the supported runtime.",
                            "Use .md or template files rather than executable Python wrappers.",
                        ),
                        _target(
                            "03_adapters",
                            "03_adapters/cli/",
                            "Offer command-line invocation for supported workflows where shell entry points remain needed.",
                            "CLI adapters invoke workflows through Python APIs.",
                        ),
                    ],
                    [
                        "Mark historical shell flows archival or redirect them through the current workflow entry point.",
                        "Do not keep a second output contract after consolidating vision tasks.",
                    ],
                )
            )

        if rel.startswith("06_workflows/") and path.suffix != ".md" and (
            ".write_text(" in text
            or "shutil.copy2(" in text
            or ".mkdir(" in text
            or ("open(" in text and ".write(" in text and "tempfile.mkstemp" not in text)
        ):
            findings.append(
                _finding(
                    path,
                    workspace,
                    generated_at,
                    "workflow_owns_persistent_file_io",
                    "medium",
                    "Workflow node performs persistent filesystem writes that should be exposed through a file/data driver.",
                    _lines_with(text, [".write_text(", "shutil.copy2(", ".mkdir(", "open(", ".write("]),
                    [
                        _target(
                            "06_workflows",
                            rel,
                            "Choose when artifacts are persisted and handle workflow state transitions.",
                            "Keep nodes focused on orchestration.",
                        ),
                        _target(
                            "08_drivers",
                            "08_drivers/file/artifacts.py",
                            "Own copying and writing artifacts under configured data roots.",
                            "Use a data-purpose module name such as artifacts.py or assets.py.",
                        ),
                    ],
                    [
                        "Extract write/copy behavior behind a driver interface without altering report schemas.",
                        "Keep dry-run and collision behavior explicit in driver tests.",
                    ],
                    confidence=0.82,
                )
            )

        if rel.startswith("05_router/") and "from mcp_servers.tools" in text:
            findings.append(
                _finding(
                    path,
                    workspace,
                    generated_at,
                    "router_depends_on_mcp_exposure_layer",
                    "medium",
                    "Router invokes implementations from the MCP exposure bucket rather than core tools or workflows.",
                    _lines_with(text, ["from mcp_servers.tools"]),
                    [
                        _target(
                            "05_router",
                            rel,
                            "Select capability routes and dispatch provider-neutral internal APIs.",
                            "Router implementations import tools, workflows, or harness contracts.",
                        ),
                        _target(
                            "07_tools",
                            "07_tools/research/",
                            "Host reusable local research and local test capability implementations.",
                            "Name modules for capabilities exposed by MCP and routing.",
                        ),
                        _target(
                            "11_mcp",
                            "11_mcp/tools/local_tools.py",
                            "Expose thin wrappers around the internal capability APIs.",
                            "MCP modules should not be internal dependency roots.",
                        ),
                    ],
                    [
                        "Extract internal implementations before rewiring router imports.",
                        "Retain MCP tool names and output shapes through delegation.",
                    ],
                )
            )

        return findings


    def audit_cross_file(workspace: Path, generated_at: str) -> list[dict[str, Any]]:
        findings: list[dict[str, Any]] = []

        runtime = workspace / "10_service_runtime/cmd.py"
        docker_harness = workspace / "04_harnesses/docker_service/harness.py"
        if (
            runtime.exists()
            and docker_harness.exists()
            and "subprocess.run" in runtime.read_text(encoding="utf-8")
            and "subprocess.run" in docker_harness.read_text(encoding="utf-8")
        ):
            findings.append(
                _finding(
                    runtime,
                    workspace,
                    generated_at,
                    "duplicate_docker_service_lifecycle_paths",
                    "medium",
                    "Service runtime and Docker service harness independently execute Docker Compose lifecycle commands.",
                    _lines_with(runtime.read_text(encoding="utf-8"), ["docker", "_action_up", "_action_down", "_action_status"]),
                    [
                        _target(
                            "10_service_runtime",
                            "10_service_runtime/",
                            "Resolve catalog services, data-path bindings, generated environment, and command semantics.",
                            "Expose a reusable runtime module plus a thin `cmd.py` CLI.",
                        ),
                        _target(
                            "04_harnesses",
                            "04_harnesses/docker_service/harness.py",
                            "Implement lifecycle contract by delegating to service runtime primitives.",
                            "Keep Harness status/log normalization without duplicate compose construction.",
                        ),
                    ],
                    [
                        "Select one implementation for compose command construction and data binding.",
                        "Add lifecycle parity tests before replacing either entry point.",
                    ],
                    related_files=[docker_harness],
                    confidence=0.8,
                )
            )
        return findings


    def run_audit(workspace: Path, output_dir: Path) -> tuple[list[dict[str, Any]], dict[str, Any]]:
        generated_at = datetime.now(timezone.utc).isoformat()
        scanned_files = iter_audited_files(workspace, output_dir)
        findings: list[dict[str, Any]] = []
        for path in scanned_files:
            findings.extend(audit_file(path, workspace, generated_at))
        findings.extend(audit_cross_file(workspace, generated_at))
        findings.sort(
            key=lambda item: (
                {"high": 0, "medium": 1, "low": 2}[item["violation"]["severity"]],
                item["file"],
                item["violation"]["code"],
            )
        )
        summary = {
            "schema_version": "1.0",
            "generated_at": generated_at,
            "workspace": str(workspace.resolve()),
            "scan_scope": SCAN_SCOPE,
            "files_scanned": len(scanned_files),
            "findings": len(findings),
            "findings_by_severity": dict(Counter(item["violation"]["severity"] for item in findings)),
            "findings_by_rule": dict(Counter(item["violation"]["code"] for item in findings)),
            "jsonl_file": str((output_dir / "findings.jsonl").resolve()),
            "schema_file": str((workspace / "01_schemas/audit.classification_finding.schema.yaml").resolve()),
        }
        return findings, summary


    def preserve_statuses(findings: list[dict[str, Any]], previous_jsonl: Path) -> None:
        """Carry reviewed statuses forward when a stable finding remains present."""
        if not previous_jsonl.exists():
            return
        previous: dict[str, str] = {}
        for line in previous_jsonl.read_text(encoding="utf-8").splitlines():
            if not line.strip():
                continue
            record = json.loads(line)
            status = record.get("status")
            if status in VALID_STATUSES:
                previous[record["finding_id"]] = status
        for finding in findings:
            finding["status"] = previous.get(finding["finding_id"], finding["status"])


    def main() -> None:
        parser = argparse.ArgumentParser(description="Audit numeric-bucket classification boundaries.")
        parser.add_argument(
            "--workspace",
            type=Path,
            default=Path(__file__).resolve().parent.parent,
            help="Path to the repo root.",
        )
        parser.add_argument(
            "--output-dir",
            type=Path,
            default=None,
            help="Output folder; defaults to <workspace>/14_data/runs/classification_audit.",
        )
        args = parser.parse_args()
        workspace = args.workspace.resolve()
        output_dir = (
            args.output_dir.resolve()
            if args.output_dir
            else workspace / "14_data" / "runs" / "classification_audit"
        )
        output_dir.mkdir(parents=True, exist_ok=True)

        findings, summary = run_audit(workspace, output_dir)
        findings_path = output_dir / "findings.jsonl"
        preserve_statuses(findings, findings_path)
        summary["findings_by_status"] = dict(Counter(item["status"] for item in findings))
        with findings_path.open("w", encoding="utf-8") as handle:
            for finding in findings:
                handle.write(json.dumps(finding, sort_keys=True) + "\n")
        (output_dir / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

        print(
            f"Scanned {summary['files_scanned']} files; wrote {summary['findings']} findings "
            f"to {summary['jsonl_file']}"
        )


    if __name__ == "__main__":
        main()
