- id: embeddings.sweep.file-hash.task
  title: Compute MD5 hash of a file
  description: |
    Return the MD5 hex digest of the file at the given path.
    Wraps lib.embeddings.sweep.file_hash.
  tags:
  - task
  extends: task.base
  inputs:
    path:
      type: string
      required: true
      description: Path to the file to hash.
  run:
  - python: |-
      import json, os
      from lib.embeddings.sweep import file_hash
      digest = file_hash("{{ path }}")
      with open(os.environ["STATE_FILE"], "w") as f:
          json.dump({"hash": digest, "path": "{{ path }}"}, f)
