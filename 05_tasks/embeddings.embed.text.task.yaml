- id: embeddings.embed.text.task
  title: Generate an embedding vector for text
  description: |
    Embed a text string through the local Ollama harness and return the
    vector. Wraps lib.embeddings.embedder.Embedder.embed.
  tags:
  - task
  extends: task.base
  inputs:
    text:
      type: string
      required: true
      description: Text to embed.
    model:
      type: string
      required: false
      default: nomic-embed-text
      description: Ollama embedding model name.
  run:
  - python: |-
      import json, os
      from lib.embeddings.embedder import Embedder
      embedder = Embedder(model="{{ model }}")
      vector = embedder.embed("{{ text }}")
      with open(os.environ["STATE_FILE"], "w") as f:
          json.dump({"vector": vector, "dimensions": len(vector)}, f)
