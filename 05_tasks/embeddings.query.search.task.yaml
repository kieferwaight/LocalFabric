- id: embeddings.query.search.task
  title: Query the local knowledge base
  description: |
    Embed a query and retrieve the top-k most relevant chunks from the
    local vector store, returning a formatted markdown context block.
    Wraps lib.embeddings.query.LocalKnowledgeQuery.query.
  tags:
  - task
  extends: task.base
  inputs:
    query_text:
      type: string
      required: true
      description: Natural-language question or task description.
    k:
      type: number
      required: false
      default: 5
      description: Number of results to return.
    model:
      type: string
      required: false
      default: nomic-embed-text
      description: Ollama embedding model name.
    as_markdown:
      type: boolean
      required: false
      default: true
      description: Return formatted markdown context block (true) or raw result list (false).
  run:
  - python: |-
      import json, os
      from lib.embeddings.query import LocalKnowledgeQuery
      lkq = LocalKnowledgeQuery(model="{{ model }}", k={{ k }})
      result = lkq.query("{{ query_text }}", as_markdown={{ as_markdown }})
      with open(os.environ["STATE_FILE"], "w") as f:
          json.dump({"result": result}, f)
