- id: image.quality.extract.task
  title: Assess image quality
  description: |
    Return quality metrics for an image: blur score, edge density,
    blank detection, mean brightness, and brightness std deviation.
    Wraps lib.image.quality.extract_quality.
  tags:
  - task
  extends: task.base
  inputs:
    path:
      type: string
      required: true
      description: Path to the image file.
  run:
  - python: |-
      import json, os
      from pathlib import Path
      from lib.image.quality import extract_quality
      result = extract_quality(Path("{{ path }}"))
      with open(os.environ["STATE_FILE"], "w") as f:
          json.dump(result, f)
