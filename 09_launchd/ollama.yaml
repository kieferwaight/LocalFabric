- id: launchd.ollama
  title: launchd - Ollama
  description: |
    Runs `ollama serve` under launchd, bound to 127.0.0.1:11434. Inherits the
    common process posture and log layout from `launchd.base`.
  tags: [launchd, ai]
  extends: launchd.base
  launchd:
    name: ollama
    category: ai
    label: com.localfabric.ollama
    program:
      - /opt/homebrew/bin/ollama
      - serve
    environment:
      PATH: /opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      HOME: "/Users/{{ user }}"
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: "/Users/{{ user }}/.ollama/models"
    stdout: "{{ log_dir }}/ollama.out.log"
    stderr: "{{ log_dir }}/ollama.err.log"
