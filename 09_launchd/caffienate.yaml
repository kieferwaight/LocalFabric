- id: launchd.caffienate
  title: launchd - Caffeinate
  description: |
    Holds the system awake under launchd by running macOS's `caffeinate -d`.
    Useful for keeping local services warm while the lid is closed.
  tags: [launchd, system]
  extends: launchd.base
  launchd:
    name: caffienate
    category: system
    label: com.localfabric.caffienate
    program:
      - /usr/bin/caffeinate
      - -d
    stdout: "{{ log_dir }}/caffienate.out.log"
    stderr: "{{ log_dir }}/caffienate.err.log"
