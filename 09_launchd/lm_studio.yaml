- id: launchd.lm-studio
  title: launchd - LM Studio
  description: |
    Runs the LM Studio CLI server bound to 127.0.0.1:1234. The `lms server
    start` command exits cleanly once the daemon is up, so this job overrides
    `launchd.base`'s `keep_alive: true` to restart only on crashes.
  tags: [launchd, ai]
  extends: launchd.base
  launchd:
    name: lm-studio
    category: ai
    label: com.localfabric.lm-studio
    program:
      - "/Users/{{ user }}/.lmstudio/bin/lms"
      - server
      - start
      - --port
      - "1234"
      - --bind
      - 127.0.0.1
    environment:
      PATH: "/Users/{{ user }}/.lmstudio/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
      HOME: "/Users/{{ user }}"
      LMS_SERVER_HOST: 127.0.0.1
    keep_alive:
      successful_exit: false
      crashed: true
    stdout: "{{ log_dir }}/lm-studio.out.log"
    stderr: "{{ log_dir }}/lm-studio.err.log"
